<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>HAND SLIT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"
      integrity="sha384-6Twx1hAeKnwfOYJAHtYeJETRiGD5pRPkjjh0pVbG1QoesncjOpw5e75Y1kOkXeRI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <aside id="panel">
      <h1>HAND SLIT</h1>
      <canvas id="camThumb" width="260" height="195" hidden></canvas>
      <p class="help">
        舉起雙手，食指之間的線就是掃描線。單手時線在拇指和食指之間。也可以用滑鼠在圖片上拖曳。
      </p>

      <button id="loadBtn" class="btn wide">載入圖片</button>
      <input id="fileInput" type="file" accept="image/*" hidden />
      <div class="row"><span>成品尺寸</span><span id="sizeValue">1790 × 2560</span></div>
      <div class="pair">
        <button id="portraitBtn" class="btn active">直向</button>
        <button id="landscapeBtn" class="btn">橫向</button>
      </div>

      <div class="hr"></div>

      <div class="row"><span>成品方向</span></div>
      <div class="grid2">
        <button class="btn dir active" data-dir="lr">左 → 右</button>
        <button class="btn dir" data-dir="rl">右 → 左</button>
        <button class="btn dir" data-dir="tb">上 → 下</button>
        <button class="btn dir" data-dir="bt">下 → 上</button>
      </div>
      <div class="row"><span>每幀寬度</span><span id="thickValue">4 px</span></div>
      <input id="thickSlider" type="range" min="1" max="40" value="4" />
      <div class="row"><span>平滑</span><span id="smoothValue">35%</span></div>
      <input id="smoothSlider" type="range" min="5" max="100" value="35" />

      <div class="hr"></div>

      <button id="recBtn" class="btn primary wide">錄製中</button>
      <div class="pair">
        <button id="clearBtn" class="btn">清除</button>
        <span></span>
      </div>
      <div class="pair">
        <button id="pngBtn" class="btn" disabled>匯出 PNG</button>
        <button id="jpgBtn" class="btn" disabled>匯出 JPEG</button>
      </div>

      <p id="statusLine">&nbsp;</p>
      <p class="hints">
        <kbd>Space</kbd> 錄製 / 暫停<br />
        <kbd>C</kbd> 清除<br />
        <kbd>S</kbd> 匯出 PNG<br />
        也可以把圖片檔拖進頁面。
      </p>
    </aside>
    <main id="stage"></main>
  </body>
</html>
